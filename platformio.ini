; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; reupload of https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
; but with package.json's "name" field renamed back to framework-arduinoespressif32
platform_packages =
   framework-arduinoespressif32@https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
    DFPlayerMini_Fast
    ESP32Servo
    # EEPROM

[env:Debug]
build_flags =
    -D CORE_DEBUG_LEVEL=4
    -D CONFIG_LOG_DEFAULT_LEVEL_DEBUG=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D USE_LOG
build_type = debug

[env:Release]
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_LOG_DEFAULT_LEVEL_DEBUG=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
build_type = release
